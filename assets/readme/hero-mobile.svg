<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620" viewBox="0 0 480 620" role="img" aria-labelledby="title desc">
  <title id="title">Context Logger for Go and Zap</title>
  <desc id="desc">Context Logger moves request IDs, deadlines, and trace metadata from context.Context through Ctx and into structured Zap log entries.</desc>

  <rect width="480" height="620" rx="24" fill="#0B1110"/>

  <g id="title-block" transform="translate(28 28)">
    <text y="40" fill="#F4F7F2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="750" letter-spacing="-1.5">context</text>
    <text y="86" fill="#F4B860" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="750" letter-spacing="-1.5">logger</text>
    <text y="124" fill="#C8D1CC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">Request metadata in. Structured fields out.</text>
  </g>

  <g id="context-flow" transform="translate(20 180)">
    <g id="context-source">
      <rect width="440" height="90" rx="10" fill="#111A17" stroke="#34463F"/>
      <text x="18" y="29" fill="#AEBAB4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">context.Context</text>
      <rect x="18" y="44" width="124" height="30" rx="5" fill="#183127"/>
      <text x="80" y="65" fill="#7DE0B0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">request_id</text>
      <rect x="158" y="44" width="124" height="30" rx="5" fill="#183127"/>
      <text x="220" y="65" fill="#7DE0B0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">deadline</text>
      <rect x="298" y="44" width="124" height="30" rx="5" fill="#183127"/>
      <text x="360" y="65" fill="#7DE0B0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">trace_id</text>
    </g>

    <path d="M220 90V120" stroke="#7DE0B0" stroke-width="2"/>
    <path d="M214 114L220 120L226 114" fill="none" stroke="#7DE0B0" stroke-width="2"/>

    <g id="extractor-stage" transform="translate(45 120)">
      <rect width="350" height="72" rx="10" fill="#14201C" stroke="#4C665B"/>
      <circle cx="24" cy="36" r="5" fill="#7DE0B0"/>
      <text x="44" y="32" fill="#F4F7F2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="650">Ctx(ctx)</text>
      <text x="44" y="55" fill="#AEBAB4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">extractors -&gt; []zap.Field</text>
    </g>

    <path d="M220 192V222" stroke="#7DE0B0" stroke-width="2"/>
    <path d="M214 216L220 222L226 216" fill="none" stroke="#7DE0B0" stroke-width="2"/>

    <g id="log-output" transform="translate(0 222)">
      <rect width="440" height="180" rx="10" fill="#111A17" stroke="#34463F"/>
      <circle cx="20" cy="24" r="5" fill="#F4B860"/>
      <text x="38" y="30" fill="#C8D1CC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">zap.Logger</text>
      <text x="20" y="68" fill="#F4F7F2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">{ "msg": "request completed",</text>
      <text x="20" y="95" fill="#7DE0B0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">  "request_id": "req-7f3",</text>
      <text x="20" y="122" fill="#7DE0B0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">  "context_time_left": 1.8,</text>
      <text x="20" y="149" fill="#7DE0B0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">  "trace_id": "4bf9..." }</text>
    </g>
  </g>
</svg>
